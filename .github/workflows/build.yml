name: ZLMod CI

on:
  push:
    branches: [main]
    tags: ["build-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      ZLMOD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure executable permissions
        run: |
          chmod +x Scripts/*.sh Scripts/*.py Packaging/*.py || true

      - name: Select Xcode toolchain
        run: |
          echo "Available Xcode versions:"
          ls /Applications | grep -i xcode || true
          XC=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app /Applications/Xcode_15*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then
            echo "Selecting Xcode: $XC"
            sudo xcode-select -s "$XC"
          fi
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-path

      - name: Portable contract & identity tests
        run: |
          python3 -m unittest discover -s Tests -p "test_*.py" -v
          python3 Scripts/project_gate.py .

      - name: Build libZLMod.dylib
        run: make

      - name: Verification gates
        run: bash Scripts/gates.sh build/libZLMod.dylib

      - name: Metadata + reports
        run: bash Scripts/report.sh build/libZLMod.dylib build

      - name: Package artifacts
        run: |
          cd build
          cp ../README.md README.md 2>/dev/null || true
          zip -9 "ZLMod-${ZLMOD_VERSION}.zip" \
            libZLMod.dylib libZLMod.dylib.sha256 libZLMod.nm.txt libZLMod.otool-L.txt \
            libZLMod.file.txt IMPLEMENTATION-REPORT.md COMPATIBILITY-REPORT.md README.md

      - name: Detect & Repackage Decrypted IPAs
        run: |
          DECRYPTED_IPA=""
          if compgen -G "Decrypted/*.ipa" > /dev/null; then
            DECRYPTED_IPA=$(ls -1 Decrypted/*.ipa | head -n 1)
            echo "[*] Found decrypted IPA in Decrypted/: $DECRYPTED_IPA"
          elif compgen -G "Base/*.ipa" > /dev/null; then
            DECRYPTED_IPA=$(ls -1 Base/*.ipa | head -n 1)
            echo "[*] Found decrypted IPA in Base/: $DECRYPTED_IPA"
          elif compgen -G "*.ipa" > /dev/null; then
            DECRYPTED_IPA=$(ls -1 *.ipa | head -n 1)
            echo "[*] Found decrypted IPA in repo root: $DECRYPTED_IPA"
          fi

          if [ -n "$DECRYPTED_IPA" ]; then
            echo "[+] Repackaging Full IPA from $DECRYPTED_IPA..."
            python3 Packaging/package_ipa.py \
              --input "$DECRYPTED_IPA" \
              --output "build/Zalo-ZLMod-${ZLMOD_VERSION}-full-unsigned.ipa" \
              --bundle-id "auto" \
              --allow-custom-bundle-id \
              --dylib build/libZLMod.dylib

            echo "[+] Repackaging No-Appex IPA from $DECRYPTED_IPA..."
            python3 Packaging/package_ipa.py \
              --input "$DECRYPTED_IPA" \
              --output "build/Zalo-ZLMod-${ZLMOD_VERSION}-noappex-unsigned.ipa" \
              --bundle-id "auto" \
              --allow-custom-bundle-id \
              --dylib build/libZLMod.dylib \
              --no-appex

            cd build
            shasum -a 256 *.ipa > ipa_checksums.sha256.txt || true
          else
            echo "[*] No decrypted base IPA committed. Skipping IPA injection."
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZLMod-${{ env.ZLMOD_VERSION }}
          path: |
            build/libZLMod.dylib
            build/*.sha256
            build/*-REPORT.md
            build/ZLMod-*.zip
            build/*.ipa
            build/*.sha256.txt

      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/build-')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: ZLMod ${{ github.ref_name }}
          fail_on_unmatched_files: false
          body: |
            ZLMod ${{ github.ref_name }} — Zalo native customization dylib.

            - Targets: Zalo 26.10.02 (261002802) & 26.11.01 (261101802), vn.com.vng.zingalo / vn.com.vng.zingalo2, arm64, iOS 15.1+
            - Modules: ZLModCore, ZLModCompatibility, ZLModPreferences, ZLModHookEngine,
              ZLModCryptoStore, ZLModPolicyStore, ZLModURIFilter, ZLModPrivacy,
              ZLModConversationMenu, ZLModAntiRecall, ZLModUtilities, ZLModTheme,
              ZLModAds, ZLModFeatures, ZLModSettings, ZLModUI, ZLModGlass, ZLModBridge
            - Verification gates passed: arm64, deps clean (no substrate),
              install_name, minos 15.1, UIGlassEffect runtime-guarded, codesigned
            - See IMPLEMENTATION-REPORT.md and COMPATIBILITY-REPORT.md

            Not ported by design (no usable iOS mechanism / server-authoritative / unsafe):
            Original Photo Default, ZCloud premium unlock, video transcode bypass,
            server TTL/upload limit override, group admin/owner spoofing, chat-head overlay.
          files: |
            build/ZLMod-*.zip
            build/libZLMod.dylib
            build/libZLMod.dylib.sha256
            build/IMPLEMENTATION-REPORT.md
            build/COMPATIBILITY-REPORT.md
