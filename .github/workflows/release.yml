name: ZLMod Build & Release IPA

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Tên bản Release (VD: ZLMod Build 11 — Modular Architecture Rebuild)"
        required: true
        default: "ZLMod Build 11 — Modular Architecture Rebuild"
      release_tag:
        description: "Git Tag cho bản phát hành (VD: build-11)"
        required: true
        default: "build-11"
      release_description:
        description: "Mô tả chi tiết nội dung phát hành (Hỗ trợ Markdown)"
        required: false
        type: string
        default: |
          ## 🚀 ZLMod 4.0 (Build 11) — Modular Architecture Rebuild

          ### ✨ Các nâng cấp trọng tâm:
          - **Kiến trúc Event Bus tách biệt**: `ZLModMessageTapBus` + `ZLModChatEntityAdapter` tách hoàn toàn `CSaving` & `DiscordRelay` khỏi `AntiRecall`.
          - **Bảo mật Keychain-only**: `ZLModSecretStore` lưu `Bridge Token` và `Discord Webhook URL` hoàn toàn trong iOS Keychain, kèm tự động di chuyển & xóa dữ liệu plaintext cũ và kiểm tra `ZLModStorageHealth`.
          - **C-Bridge WebSocket FSM 4 trạng thái**: Chống race condition bằng `connectionEpoch`, exponential backoff (2s–30s), heartbeat 20s + pong timeout 10s, quét máy chủ LAN tự động qua Bonjour/mDNS, giữ nguyên thứ tự tin nhắn khi gửi lại CSaving, và CDeploy allowlist chặt chẽ kèm guaranteed ACK.
          - **Discord Webhook Relay tự động**: Tự động chuyển tiếp tin nhắn mới và tin nhắn bị thu hồi (kèm nội dung gốc) với kiểm tra tên miền chính thức, chống trùng lặp và giới hạn tốc độ.
          - **Anti-Recall & Tiện ích hoàn thiện**: Lưu ảnh thu hồi mã hóa trên đĩa (quota 20MB / TTL 14 ngày), sửa lỗi nhận diện sai từ "thu hồi", sửa dọn cell reuse, Ghi chú nhiều dòng, Quick Reply theo tài khoản + nút chèn nhanh trong khung chat, Delay Send đa tin nhắn tránh bàn phím.
          - **Mach-O & Packaging**: Sửa căn chỉnh 8-byte cho `LC_RPATH` trên arm64, hoàn thiện trạng thái ký một phần của IPA preflight, đồng bộ phiên bản từ `Resources/version.json`.

          ---
          ### 📦 Các bản IPA cung cấp sẵn bên dưới:
          1. **Bản noappex (Khuyến nghị cho Sideloadly / SideStore / AltStore):** Đã gỡ bỏ toàn bộ extension phụ, chỉ dùng 1 App ID duy nhất, không lo lỗi giới hạn App ID trên tài khoản miễn phí.
          2. **Bản đầy đủ (Full):** Dành cho TrollStore hoặc tài khoản Apple Developer trả phí.
      decrypted_ipa_url:
        description: "URL tải file IPA Zalo decrypted (nếu đã để file trong thư mục Decrypted/ thì có thể để trống)"
        required: false
        type: string
        default: ""
      decrypted_ipa_sha256:
        description: "SHA-256 tùy chọn để xác minh file tải từ decrypted_ipa_url"
        required: false
        type: string
        default: ""
      target_bundle_id:
        description: "Target Bundle ID ('auto' để giữ nguyên bundle ID gốc, hoặc vn.com.vng.zingalo2, vn.com.vng.zingalo)"
        required: true
        default: "auto"
      is_prerelease:
        description: "Đánh dấu là bản Pre-release?"
        required: false
        type: boolean
        default: false
      is_draft:
        description: "Tạo bản nháp (Draft Release)?"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure executable permissions
        run: |
          chmod +x Scripts/*.sh Scripts/*.py Packaging/*.py || true

      - name: Select Xcode toolchain
        run: |
          echo "Available Xcode versions:"
          ls /Applications | grep -i xcode || true
          XC=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app /Applications/Xcode_15*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then
            echo "Selecting Xcode: $XC"
            sudo xcode-select -s "$XC"
          fi
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-path

      - name: Run portable contract & identity tests
        run: |
          python3 -m unittest discover -s Tests -p "test_*.py" -v
          python3 Scripts/project_gate.py .

      - name: Compile libZLMod.dylib
        run: make

      - name: Verify gates & security constraints
        run: bash Scripts/gates.sh build/libZLMod.dylib

      - name: Generate build metadata & reports
        env:
          ZLMOD_VERSION: ${{ inputs.release_tag }}
        run: bash Scripts/report.sh build/libZLMod.dylib build

      - name: Package dylib zip archive
        run: |
          cd build
          cp ../README.md README.md 2>/dev/null || true
          zip -9 "ZLMod-${{ inputs.release_tag }}.zip" \
            libZLMod.dylib libZLMod.dylib.sha256 libZLMod.nm.txt libZLMod.otool-L.txt \
            libZLMod.file.txt IMPLEMENTATION-REPORT.md COMPATIBILITY-REPORT.md README.md

      - name: Detect & Repackage Decrypted IPAs
        run: |
          DECRYPTED_IPA=""

          # Priority 1: Direct URL download if provided in inputs
          if [ -n "${{ inputs.decrypted_ipa_url }}" ]; then
            echo "[*] Downloading decrypted base IPA from URL: ${{ inputs.decrypted_ipa_url }}..."
            curl -fSL -A "Mozilla/5.0" -o /tmp/base_decrypted.ipa "${{ inputs.decrypted_ipa_url }}"
            if [ -n "${{ inputs.decrypted_ipa_sha256 }}" ]; then
              ACTUAL_SHA=$(shasum -a 256 /tmp/base_decrypted.ipa | awk '{print $1}')
              if [ "$ACTUAL_SHA" != "${{ inputs.decrypted_ipa_sha256 }}" ]; then
                echo "ERROR: SHA-256 mismatch for downloaded IPA ($ACTUAL_SHA != ${{ inputs.decrypted_ipa_sha256 }})" >&2
                exit 1
              fi
            fi
            if unzip -tq /tmp/base_decrypted.ipa > /dev/null 2>&1; then
              DECRYPTED_IPA="/tmp/base_decrypted.ipa"
            else
              echo "[-] WARNING: File downloaded from URL is not a valid ZIP/IPA archive. Checking local directories..."
            fi
          fi

          # Priority 2: Check Decrypted/ directory in repository
          if [ -z "$DECRYPTED_IPA" ] && compgen -G "Decrypted/*.ipa" > /dev/null; then
            DECRYPTED_IPA=$(ls -1 Decrypted/*.ipa | head -n 1)
            echo "[*] Found decrypted IPA in Decrypted/: $DECRYPTED_IPA"
          fi

          # Priority 3: Check Base/ directory
          if [ -z "$DECRYPTED_IPA" ] && compgen -G "Base/*.ipa" > /dev/null; then
            DECRYPTED_IPA=$(ls -1 Base/*.ipa | head -n 1)
            echo "[*] Found decrypted IPA in Base/: $DECRYPTED_IPA"
          fi

          # Priority 4: Check root directory
          if [ -z "$DECRYPTED_IPA" ] && compgen -G "*.ipa" > /dev/null; then
            DECRYPTED_IPA=$(ls -1 *.ipa | head -n 1)
            echo "[*] Found decrypted IPA in repo root: $DECRYPTED_IPA"
          fi

          if [ -z "$DECRYPTED_IPA" ]; then
            echo "[*] No decrypted base IPA found in Decrypted/, Base/, root, or via URL."
            echo "[*] Skipping IPA injection. Only libZLMod.dylib and reports will be published."
            echo "[*] (To auto-build IPAs: commit your decrypted Zalo IPA to Decrypted/*.ipa or pass decrypted_ipa_url)."
            exit 0
          fi

          echo "[+] Using decrypted IPA source: $DECRYPTED_IPA"
          BUNDLE_ARG="${{ inputs.target_bundle_id }}"
          if [ -z "$BUNDLE_ARG" ]; then
            BUNDLE_ARG="auto"
          fi

          echo "[*] Repackaging Full IPA (with extensions)..."
          python3 Packaging/package_ipa.py \
            --input "$DECRYPTED_IPA" \
            --output "build/Zalo-ZLMod-${{ inputs.release_tag }}-full-unsigned.ipa" \
            --bundle-id "$BUNDLE_ARG" \
            --allow-custom-bundle-id \
            --dylib build/libZLMod.dylib

          echo "[*] Repackaging No-Appex IPA (stripped extensions for free Apple ID)..."
          python3 Packaging/package_ipa.py \
            --input "$DECRYPTED_IPA" \
            --output "build/Zalo-ZLMod-${{ inputs.release_tag }}-noappex-unsigned.ipa" \
            --bundle-id "$BUNDLE_ARG" \
            --allow-custom-bundle-id \
            --dylib build/libZLMod.dylib \
            --no-appex

          echo "[*] Running IPA preflight verification on both outputs..."
          python3 Packaging/ipa_preflight.py "build/Zalo-ZLMod-${{ inputs.release_tag }}-full-unsigned.ipa" --require-unencrypted-main
          python3 Packaging/ipa_preflight.py "build/Zalo-ZLMod-${{ inputs.release_tag }}-noappex-unsigned.ipa" --require-unencrypted-main

          echo "[*] Generating SHA256 checksums for repacked IPAs..."
          cd build
          shasum -a 256 *.ipa > ipa_checksums.sha256.txt || true
          cat ipa_checksums.sha256.txt || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZLMod-${{ inputs.release_tag }}-artifacts
          path: |
            build/libZLMod.dylib
            build/*.sha256
            build/*-REPORT.md
            build/ZLMod-*.zip
            build/*.ipa
            build/*.sha256.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          body: ${{ inputs.release_description }}
          prerelease: ${{ inputs.is_prerelease }}
          draft: ${{ inputs.is_draft }}
          fail_on_unmatched_files: false
          files: |
            build/ZLMod-*.zip
            build/libZLMod.dylib
            build/libZLMod.dylib.sha256
            build/*.ipa
            build/*.sha256.txt
            build/*-REPORT.md
